<!DOCTYPE html>
<html>
<head>
    <title>Microsoft Login Callback</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background-color: #f9fafb;">
    <div style="text-align: center; padding: 2rem; background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); max-width: 320px; width: 100%;">
        <svg style="width: 48px; height: 48px; margin-bottom: 1rem; animation: spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="2" x2="12" y2="6"></line>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
            <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
            <line x1="2" y1="12" x2="6" y2="12"></line>
            <line x1="18" y1="12" x2="22" y2="12"></line>
            <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
            <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
        </svg>
        <style>
            @keyframes spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        </style>
        <h3 style="font-size: 14px; font-weight: 600; color: #111827; margin: 0 0 0.5rem 0;">Authenticating with Microsoft</h3>
        <p style="font-size: 12px; color: #6b7280; margin: 0;">This window will close automatically once signed in...</p>
    </div>
    <script>
        try {
            // Parse the hash fragment for tokens
            const hash = window.location.hash;
            if (hash) {
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const error = params.get('error');
                const errorDescription = params.get('error_description');

                if (accessToken) {
                    window.opener.postMessage({ type: 'MS_SSO_SUCCESS', accessToken }, window.location.origin);
                } else if (error) {
                    window.opener.postMessage({ type: 'MS_SSO_ERROR', error: errorDescription || error }, window.location.origin);
                }
            } else {
                // Check query params if any
                const urlParams = new URLSearchParams(window.location.search);
                const error = urlParams.get('error');
                const errorDescription = urlParams.get('error_description');
                if (error) {
                    window.opener.postMessage({ type: 'MS_SSO_ERROR', error: errorDescription || error }, window.location.origin);
                } else {
                    window.opener.postMessage({ type: 'MS_SSO_ERROR', error: 'No authentication parameters received' }, window.location.origin);
                }
            }
        } catch (err) {
            console.error('Error during postMessage:', err);
        } finally {
            // Safe delay to ensure postMessage was processed before closing
            setTimeout(() => {
                window.close();
            }, 100);
        }
    </script>
</body>
</html>
